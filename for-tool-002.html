<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FOR-TOOL-002 — Analizador de Logs en desarrollo.">
  <title>FOR-TOOL-002 | En desarrollo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root { color-scheme: dark; font-family: Consolas, "Courier New", monospace; background: #050505; color: #00ff88; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      background-color: #050505;
      background-image: linear-gradient(rgba(0,255,136,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,136,.035) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    main {
      position: relative; width: min(760px, 100%); padding: clamp(28px, 6vw, 58px);
      border: 1px solid rgba(0,255,136,.58); border-left: 2px solid #00ff88; background: rgba(7,7,7,.96);
      box-shadow: inset 0 0 30px rgba(0,255,136,.04), 0 0 24px rgba(0,255,136,.08);
    }
    .code { margin: 0 0 24px; color: #00ff88; font-size: 12px; letter-spacing: 2px; }
    h1 { margin: 0; color: #b388ff; font-size: clamp(21px, 3.5vw, 34px); font-weight: 400; line-height: 1.2; letter-spacing: 2px; }
    .status { display: inline-block; margin: 28px 0 18px; padding: 8px 12px; border: 1px solid rgba(0,255,136,.55); font-size: 11px; letter-spacing: 1.5px; }
    .message { max-width: 620px; margin: 0; color: #b7c7bf; font-size: 14px; line-height: 1.8; }
    a { display: inline-block; margin-top: 34px; padding: 10px 14px; border: 1px solid rgba(0,255,136,.55); color: #b388ff; font-size: 12px; letter-spacing: 1.5px; text-decoration: none; transition: .2s ease; }
    a:hover, a:focus-visible { color: #00ff88; border-color: #00ff88; background: rgba(0,255,136,.07); box-shadow: 0 0 12px rgba(0,255,136,.16); outline: none; }
  </style>
</head>
<body>
  <main>
    <p class="code">[ FOR-TOOL-002 ]</p>
    <h1>ANALIZADOR DE LOGS</h1>
    <span class="status">[ ESTADO: EN DESARROLLO ]</span>
    <p class="message">Estamos desarrollando esta herramienta para analizar archivos de logs de distintos sistemas, detectar eventos relevantes, resumir la información y generar un informe. Próximamente estará disponible.</p>
    <a href="index.html">[ VOLVER AL ARCHIVO ]</a>
  </main>
</body>
</html>
